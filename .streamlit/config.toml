# The chart palette was validated against the light chart surface #fcfcfb.
# Pinning the light theme keeps the rendered colours the ones that were checked.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
