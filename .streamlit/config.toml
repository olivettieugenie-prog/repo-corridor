# Generated by src/design.py for the "tempered" design. Do not hand-edit.
# Both palettes are declared, so Streamlit's own light/dark switch (the
# Settings menu, or the viewer's system preference) picks between them and the
# charts follow via st.context.theme.
#
# Fonts use Streamlit's supported "Name:url" form rather than injected CSS:
# st.html strips <link> tags, so a stylesheet link never loads, and Streamlit's
# own heading rules outrank an injected h1 selector.
[theme]
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap"
headingFont = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@600;700&display=swap"

[theme.light]
primaryColor = "#0267C7"
backgroundColor = "#F8F8F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111439"

[theme.dark]
primaryColor = "#0C84FA"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#141A2E"
textColor = "#E8EAF2"

[browser]
gatherUsageStats = false
